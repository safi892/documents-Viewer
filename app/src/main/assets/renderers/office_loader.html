<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- 1.0 is fit-to-width: the reader pill and the WebView share the same
       floor, so a document can never shrink below the screen. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=4, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="stylesheet" href="/assets/renderers/engines.css" />
  <title>Document</title>
</head>
<body>
  <!-- docx-preview injects the document's own stylesheet here, never into <head> -->
  <div id="docx-styles" aria-hidden="true"></div>
  <main id="surface" role="document"></main>
  <script src="/assets/renderers/harness.js"></script>
</body>
</html>
